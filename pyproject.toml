[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcti"
version = "0.3.0"
description = "Reproducible, evidence-grounded CTI mitigation evaluation with local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
deepcti = "deepcti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

