# Curated affected ranges for D7 `vendor` products (half-open [introduced, fixed), product version
# semantics). Source: vendor advisory statement (quoted in cve_meta `range_statement` from the NVD/CNA
# description or the vendor page) cross-checked against NVD CPE configurations by select/build scripts.
# Jenkins publishes LTS (x.y.z) and weekly (x.y) lines from one numbering; an LTS fix is numerically below
# later weekly releases, so each line gets its own range ([0, LTS fix) and [first weekly after the LTS
# baseline, weekly fix)). EOL branches without a fix (Tomcat 8.5 after 8.5.100) are folded into the next
# branch's range when the vendor lists them as affected (no `last_affected` is used: the shared comparator
# only implements introduced/fixed).
CVE-2020-1938:
  ranges: [{introduced: "7.0.0", fixed: "7.0.100"}, {introduced: "8.5.0", fixed: "8.5.51"}, {introduced: "9.0.0.M1", fixed: "9.0.31"}]
  statement: "tomcat.apache.org security-7/8/9: Affects 7.0.0 to 7.0.99 (fixed 7.0.100), 8.5.0 to 8.5.50 (fixed 8.5.51), 9.0.0.M1 to 9.0.30 (fixed 9.0.31)"
