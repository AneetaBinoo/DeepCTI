# DeepCTI v3 — curated configuration preconditions for D1 and D7 (superset of config_preconditions.yaml).
#
# The D1 entries below are copied unchanged from config/config_preconditions.yaml (same schema, same
# predicate semantics; see the comment block that follows). D7 entries are appended after the marker
# "D7 additions". Quotes for D7 entries were taken verbatim (whitespace-normalised) on 2026-10-05 from the
# advisory pages mirrored under data/mirrors/advisory_pages/2026-10-05/ (see MANIFEST.json there).
#
# D7 schema additions (all optional; D1 entries do not use them):
#   * ecosystem: deb-ubuntu | pypi | maven | vendor  (absent = D1 Debian entry)
#   * component: ecosystem component the precondition belongs to (PyPI name, groupId:artifactId, product)
#     (`src_package` repeats it for non-deb entries so that consumers of the D1 schema keep working)
#   * applies_to_versions: list of half-open ranges [{introduced, fixed}] in the ecosystem's version
#     semantics. The precondition (req_config) only applies to installed versions inside one of these
#     ranges; outside them the vulnerable code path is reachable regardless of configuration.
#   * predicate kind `regex_present`: TRUE iff Python `re.search(pattern, text, re.MULTILINE)` matches,
#     where `text` is the file content after (1) removing XML comments `<!-- ... -->` and (2) dropping
#     lines whose first non-blank character is '#' or ';'. A missing file is FALSE.
#   * files under opt/<app>/ use one fixed application directory per CVE (the D7 builder places every
#     host of that CVE there).
# DeepCTI v2 — curated configuration preconditions (D1 atoms req_config / vuln_config_enabled).
#
# Each entry documents, from the cited advisory, that the vulnerable code is only reachable when a
# specific feature is configured. Quotes were fetched verbatim on 2026-10-05.
#
# Predicate semantics (evaluated deterministically on the fixture rootfs; TRUE = vulnerable feature ENABLED):
#   * config syntax: one directive per line, "Key value" or "key = value"; lines starting with '#' or ';'
#     (after leading whitespace) are comments. The value is the rest of the line after the key
#     (and after '=' for "key = value"), whitespace-trimmed, compared exactly (case-sensitive).
#   * directive_present / directive_absent: an uncommented line with that key exists / does not exist.
#   * value_equals / value_not_equals: compare the value of the LAST uncommented occurrence of the key
#     (sshd uses the first occurrence; fixtures only ever contain one occurrence, so both agree).
#     A missing file or missing key makes value_equals FALSE and value_not_equals FALSE.
#   * module_enabled: `file` is a directory (apache-style mods-enabled) and `key` is the "<module>.load"
#     name; TRUE iff file/key exists in the fixture.
# Fixture convention: for every host that installs the package, the key is written explicitly
# (vulnerable or safe line), so the "missing key" corner case never decides a label.
# Bind values keep the trailing ';' exactly as written in named.conf syntax.
preconditions:
  - cve: CVE-2024-6387
    src_package: openssh
    service: ssh
    file: etc/ssh/sshd_config
    key: LoginGraceTime
    predicate: {kind: value_not_equals, value: "0"}
    vulnerable_when: "LoginGraceTime != 0 (sshd default is 120 when unset)"
    vulnerable_setting: "LoginGraceTime 120"
    safe_setting: "LoginGraceTime 0"
    advisory_url: https://www.qualys.com/2024/07/01/cve-2024-6387/regresshion.txt
    quote: "this signal handler race condition can be fixed by simply setting LoginGraceTime to 0 in the
      configuration file. This makes sshd vulnerable to a denial of service (the exhaustion of all
      MaxStartups connections), but it makes it safe from the remote code execution presented in this
      advisory."
    notes: "Mitigation trades RCE for DoS. Debian default (commented '#LoginGraceTime 2m') is vulnerable."

  - cve: CVE-2021-41617
    src_package: openssh
    service: ssh
    file: etc/ssh/sshd_config
    key: AuthorizedKeysCommandUser
    predicate: {kind: directive_present}
    vulnerable_when: "AuthorizedKeysCommand with AuthorizedKeysCommandUser configured"
    vulnerable_setting: "AuthorizedKeysCommandUser nobody   (with AuthorizedKeysCommand /usr/local/bin/get-keys %u)"
    safe_setting: "#AuthorizedKeysCommandUser nobody"
    advisory_url: https://www.openssh.com/txt/release-8.8
    quote: "sshd(8) from OpenSSH 6.2 through 8.7 failed to correctly initialise supplemental groups when
      executing an AuthorizedKeysCommand or AuthorizedPrincipalsCommand, where a AuthorizedKeysCommandUser
      or AuthorizedPrincipalsCommandUser directive has been set to run the command as a different user.
      [...] Neither AuthorizedKeysCommand nor AuthorizedPrincipalsCommand are enabled by default in
      sshd_config(5)."
    notes: "Fixed in Debian before bookworm/trixie were released: only fixed/absent cases in D1."

